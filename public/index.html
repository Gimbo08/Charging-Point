<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Charging Point</title>
  <link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/charging-point-lightning.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=17">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">CHARGING POINT</p><h1>Ricarica intelligente</h1></div><div class="header-actions"><button id="paletteToggle" class="secondary theme-control" type="button" aria-label="Cambia palette" title="Cambia palette">🎨</button><button id="themeToggle" class="secondary theme-control" type="button" aria-label="Cambia tema" title="Cambia tema">☀️</button><button id="logout" class="secondary theme-control hidden" type="button">Esci</button></div></header>
    <section id="login" class="card login"><h2>Accedi</h2><p>Gestisci la wallbox in sicurezza da smartphone, laptop o tablet.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginButton">Accedi</button><p id="loginError" class="error"></p></section>
    <section id="dashboard" class="dashboard hidden">
      <section class="energy-card card">
        <div class="energy-head">
          <div><p class="label">WALLBOX</p><div class="status-line"><span class="status-dot"></span><strong id="status">—</strong></div></div>
          <span id="modeBadge" class="badge offline">OCPP non connesso</span>
        </div>
        <div class="energy-metrics">
          <div class="energy-metric"><span class="metric-label">POTENZA IN EROGAZIONE</span><div id="powerDisplay" class="power-display"><span id="chargingAnimation" class="charging-animation" aria-hidden="true">⚡</span><strong id="power">—</strong><span id="current" class="power-current">(—)</span></div></div>
          <div class="energy-metric session-metric"><span class="metric-label">SESSIONE ATTUALE</span><strong id="sessionEnergy">—</strong><span class="metric-detail">Energia immessa</span></div>
        </div>
      </section>
      <section class="control-card card">
        <div class="control-head"><div><p class="label">MODALITÀ DI CONTROLLO</p><h2>Ricarica</h2></div><div class="mode-switch" role="tablist" aria-label="Modalità di ricarica"><button class="mode-option active" type="button" aria-selected="true">Bypass manuale</button><button class="mode-option solar-option" type="button" aria-selected="false" disabled>Solare intelligente</button></div></div>
        <div class="current-row"><div><span class="metric-label">CORRENTE IMPOSTATA</span><div class="current-value"><span id="ampsValue">6</span><small>A</small></div></div><button id="applyButton" class="apply-button" disabled>Applica</button></div>
        <div class="slider-wrap"><input id="amps" type="range" min="6" max="32" step="1" value="6"><div class="range-labels"><span>6 A</span><span>32 A</span></div></div>
        <label for="expires">Fine ricarica</label><input id="expires" type="datetime-local">
        <div class="button-row"><button id="startButton" class="success" disabled>Attiva ricarica</button><button id="stopButton" class="danger" disabled>Disattiva ricarica</button></div><p id="actionMessage" class="message"></p><pre id="configurationResult" class="configuration-result hidden"></pre>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js?v=17"></script>
</body>
</html>
