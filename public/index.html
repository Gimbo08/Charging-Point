<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Charging Point</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">CHARGING POINT</p><h1>Ricarica intelligente</h1></div><div class="header-actions"><button id="themeToggle" class="secondary theme-toggle" type="button" aria-label="Attiva tema chiaro">☀️</button><button id="logout" class="secondary hidden">Esci</button></div></header>
    <section id="login" class="card login"><h2>Accedi</h2><p>Gestisci la wallbox in sicurezza da smartphone, laptop o tablet.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginButton">Accedi</button><p id="loginError" class="error"></p></section>
    <section id="dashboard" class="hidden"><div class="grid"><article class="card wallbox-card"><p class="label">WALLBOX</p><div class="wallbox-status"><strong id="status">—</strong></div></article><article class="card"><p class="label">POTENZA</p><div id="powerDisplay" class="power-display"><span id="chargingAnimation" class="charging-animation" aria-hidden="true">⚡</span><strong id="power">—</strong></div><p id="current">—</p><p>Sessione: <span id="sessionEnergy">—</span></p></article></div><article class="card"><div class="row"><div><p class="label">BYPASS MANUALE</p><h2><span id="ampsValue">6</span> A</h2></div><span id="modeBadge" class="badge offline">OCPP non connesso</span></div><div class="slider-row"><div class="slider-control"><input id="amps" type="range" min="6" max="32" step="1" value="6"><div class="range-labels"><span>6 A</span><span>32 A</span></div></div><button id="applyButton" disabled>Applica</button></div><label for="expires">Fine modalità (opzionale)</label><input id="expires" type="datetime-local"><div class="button-row"><button id="startButton" class="success" disabled>Attiva ricarica</button><button id="stopButton" class="danger" disabled>Disattiva ricarica</button></div><p id="actionMessage" class="message"></p><pre id="configurationResult" class="configuration-result hidden"></pre></article></section>
  </main>
  <script type="module" src="/app.js?v=6"></script>
</body>
</html>
